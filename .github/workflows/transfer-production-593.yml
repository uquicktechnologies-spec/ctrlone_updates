name: Publish reviewed signed CtrlOne 1.3.593 artifacts only

on:
  push:
    branches: [transfer/signed593-reviewed-artifacts]

permissions: {}

concurrency:
  group: ctrlone-reviewed-installer-artifact-publication
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'uquicktechnologies-spec/ctrlone_updates' && github.ref == 'refs/heads/transfer/signed593-reviewed-artifacts' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify signed-byte pins and preserve all update feeds
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 transfer/transfer-production-593.py
