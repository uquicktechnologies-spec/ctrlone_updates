name: Transfer verified CtrlOne 1.3.590 test installers

on:
  push:
    branches: [transfer/msi590-verified-bytes]

permissions:
  contents: write

concurrency:
  group: ctrlone-590-verified-byte-transfer
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'uquicktechnologies-spec/ctrlone_updates' && github.ref == 'refs/heads/transfer/msi590-verified-bytes' && github.event.deleted == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify chunks and publish the existing test bytes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 transfer/transfer-590.py
